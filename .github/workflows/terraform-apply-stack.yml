name: Terraform apply (reusable)

# Called by terraform-apply.yml (dev) and terraform-apply-dev-app.yml (dev-app).
# A plan job (read-only identity), then an apply job behind the "dev" environment gate.

on:
  workflow_call:
    inputs:
      stack:
        description: Folder name under infra/terraform/envs
        required: true
        type: string

permissions:
  contents: read

env:
  TF_VERSION: "1.16.1"
  TF_IN_AUTOMATION: "true"
  WORKING_DIR: infra/terraform/envs/${{ inputs.stack }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}

jobs:
  plan:
    name: Plan (${{ inputs.stack }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # No "environment" on this job, so it uses the repo-level read-only identity.
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init -backend-config=backend.hcl -input=false

      - name: Terraform plan
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan

      - name: Show the plan to the approver
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          {
            echo '### Terraform plan (${{ inputs.stack }})'
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.stack }}
          path: ${{ env.WORKING_DIR }}/tfplan
          retention-days: 1
          if-no-files-found: error

  apply:
    name: Apply (${{ inputs.stack }})
    needs: plan
    runs-on: ubuntu-latest
    # Pauses until apra-reviewer approves. The environment's AZURE_CLIENT_ID
    # (the apply identity) overrides the repo-level one for this job only.
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init -backend-config=backend.hcl -input=false

      - uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.stack }}
          path: ${{ env.WORKING_DIR }}

      - name: Terraform apply (the exact reviewed plan)
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform apply -input=false -lock-timeout=5m tfplan