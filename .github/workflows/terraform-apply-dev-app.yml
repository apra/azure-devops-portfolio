name: Terraform Apply (dev-app)

on:
  push:
    branches: [main]
    paths:
      - "infra/terraform/envs/dev-app/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-apply-dev-app
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/terraform-apply-stack.yml
    with:
      stack: dev-app
    permissions:
      contents: read
      id-token: write