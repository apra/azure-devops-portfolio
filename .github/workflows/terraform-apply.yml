name: Terraform Apply (dev)

on:
  push:
    branches: [main]
    paths:
      - "infra/terraform/envs/dev/**"

permissions:
  contents: read

# Never run two applies of this stack at once, and never cancel one halfway.
concurrency:
  group: terraform-apply-dev
  cancel-in-progress: false

jobs:
  apply:
    uses: ./.github/workflows/terraform-apply-stack.yml
    with:
      stack: dev
    permissions:
      contents: read
      id-token: write