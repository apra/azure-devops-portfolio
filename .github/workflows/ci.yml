name: CI

# Runs on every PR into main, and on pushes to main (post-merge safety net).
# Path filters below mean each job only runs when its service actually changed —
# this is what makes the monorepo scale: one PR to orders-service doesn't
# rebuild auth-service and notifications-service too.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      orders: ${{ steps.filter.outputs.orders }}
      notifications: ${{ steps.filter.outputs.notifications }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'auth-service/**'
            orders:
              - 'orders-service/**'
            notifications:
              - 'notifications-service/**'

  auth-service:
    name: auth-service (lint + test)
    needs: changes
    if: needs.changes.outputs.auth == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: auth-service/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (black)
        run: black --check .
      - name: Test (pytest)
        run: pytest -v

  orders-service:
    name: orders-service (lint + test)
    needs: changes
    if: needs.changes.outputs.orders == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orders-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: orders-service/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (black)
        run: black --check .
      - name: Test (pytest)
        run: pytest -v

  notifications-service:
    name: notifications-service (lint + test)
    needs: changes
    if: needs.changes.outputs.notifications == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notifications-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: notifications-service/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (black)
        run: black --check .
      - name: Test (pytest)
        run: pytest -v

  # Branch protection requires a single named status check. Since the three
  # jobs above are conditional, this job always runs and reports success
  # only if none of the (triggered) jobs above failed — this is the check
  # you'll require in branch protection settings.
  ci-summary:
    name: CI Summary (required check)
    needs: [changes, auth-service, orders-service, notifications-service]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.auth-service.result }}" == "failure" || \
                "${{ needs.orders-service.result }}" == "failure" || \
                "${{ needs.notifications-service.result }}" == "failure" ]]; then
            echo "One or more service checks failed."
            exit 1
          fi
          echo "All triggered service checks passed (or were skipped as unchanged)."
